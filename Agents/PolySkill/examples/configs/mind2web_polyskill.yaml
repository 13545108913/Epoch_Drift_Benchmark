# PolySkill Configuration for Mind2Web Experiments
# This config enables polymorphic skill induction on Mind2Web

skill_induction:
  enabled: true
  judge_method: webjudge_online_mind2web  # Mind2Web-specific judge
  use_screenshots: true
  storage_path: ./results/mind2web_skills/
  score_threshold: 3  # Minimum screenshot score (1-5) for success

  # Polymorphic skill settings
  use_polymorphism: true
  abstract_class_induction: true
  composition_enabled: true

  # Learning frequency
  update_frequency: 1  # Learn after every successful task

  formats:
    - code  # Primary format for polymorphic skills

# Model Configuration
model_configs:
  gpt4:
    provider: openai
    name: gpt-4.1
    temperature: 0.1

  claude:
    provider: anthropic
    name: claude-3.7-sonnet
    temperature: 0.1

# Benchmark Settings
benchmarks:
  mind2web-cross-task:
    dataset: mind2web
    split: cross_task
    max_examples: 252
    max_steps: 30

  mind2web-cross-website:
    dataset: mind2web
    split: cross_website
    max_examples: 177
    max_steps: 30

  mind2web-cross-domain:
    dataset: mind2web
    split: cross_domain
    max_examples: 912
    max_steps: 30

# Agent Configuration
agents:
  default:
    name: hsm_v3_with_polyskill
    model_config_name: gpt4
    max_actions_per_step: 5

# Runner Settings
runner:
  threads: 1  # Sequential execution for online learning
  timeout_per_task: 600  # 10 minutes per task
  save_trajectories: true
  result_dir: ./results/mind2web/
