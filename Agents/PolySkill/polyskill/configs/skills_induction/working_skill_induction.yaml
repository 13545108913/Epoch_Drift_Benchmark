run_name: skill_induction_test

runner:
  threads: 2
  output_dir: ./results/skill_induction
  seed: 42

model_configs:
  gpt_4:
    provider: openai
    name: gpt-4
    temperature: 0.3
    max_tokens: 8192
  claude:
    provider: anthropic
    name: claude-3-sonnet-20240229
    temperature: 0.3
    max_tokens: 8192

benchmarks:
  webarena_shopping:
    dataset: webarena-shopping
    max_examples: 5
    max_steps: 15
    headless: true
    reset_env: false

agents:
  hsm_v3_gpt:
    name: hsm_v3
    model_config_name: gpt_4
  hsm_v3_asi_gpt:
    name: hsm_v3_asi
    model_config_name: gpt_4
  asi_claude:
    name: asi
    model_config_name: claude