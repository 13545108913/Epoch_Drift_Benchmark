# Simple Online Skill Induction Configuration
# Minimal configuration to get started with skill learning

run_name: skill_learning_run

runner:
  threads: 2
  output_dir: ./results/skill_induction
  seed: 42

model_configs:
  gpt_4:
    provider: openai 
    name: gpt-4
    temperature: 0.7
    max_tokens: 8192

benchmarks:
  # Start with WebArena shopping tasks
  webarena:
    dataset: webarena-shopping
    max_examples: 10
    max_steps: 15
    headless: true
    reset_env: true

agents:
  hsm_v3_learner:
    name: hsm_v3_asi
    model_config_name: gpt_4
    # Enable skill learning with minimal config
    enable_skill_induction: true
    skill_storage_path: ./learned_skills