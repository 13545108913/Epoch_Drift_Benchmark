run_name: test_m2w_hsmv3

runner:
  threads: 4
  output_dir: ./output/browsergym_eval
  seed: 42

# Optional Skill Induction Configuration (disabled by default)
# Uncomment and modify to enable skill induction for this evaluation
# skill_induction:
#   enabled: true
#   judge_method: webjudge_online_mind2web
#   judge_model:
#     provider: openai
#     name: gpt-4o
#     temperature: 0.0
#     max_tokens: 4096
#   storage_path: ./learned_skills/m2w_basic/
#   min_actions: 2
#   max_actions: 10
#   use_reward_signal: false
#   score_threshold: 3

model_configs:
  gpt_4o:
    provider: openai 
    name: gpt-4o
    temperature: 0.3
    max_tokens: 16384
  claude:
    provider: anthropic 
    name: claude-sonnet-4-20250514
    temperature: 0.3
    max_tokens: 8192
  claude_3_7_sonnet:
    provider: anthropic 
    name: claude-3-7-sonnet-20250219
    temperature: 0.3
    max_tokens: 8192

benchmarks:
  # webarena_reddit:
  #   dataset: webarena-demo
  #   max_examples: -1
  #   max_steps: 100
  #   headless: true
  #   reset_env: false
  onlinem2w:
    dataset: onlinem2w-test
    max_examples: -1
    max_steps: 30
    headless: true
    reset_env: false
    # viewport_size:
    #   width: 500
    #   height: 320

agents:
  hsm_v3_claude:
    name: hsm_v3
    model_config_name: claude
