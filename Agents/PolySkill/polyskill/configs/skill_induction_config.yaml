# Simple Skill Induction Configuration
# For online learning during evaluation

skill_induction:
  enabled: true
  judge_method: visual  # simple, visual, or detailed
  use_screenshots: true
  storage_path: ./learned_skills/
  update_frequency: 3  # Learn after every 3 successful tasks
  formats:
    - code
    - natural_language

# Example evaluation config (optional)
model_configs:
  default:
    provider: openai
    name: gpt-4.1
    temperature: 0.3

benchmarks:
  webarena-shopping:
    dataset: webarena-shopping
    max_examples: 10
    max_steps: 15

agents:
  default:
    name: hsm_v3
    model_config_name: default