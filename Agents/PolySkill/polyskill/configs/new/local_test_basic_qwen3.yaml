run_name: test

runner:
  threads: 4
  output_dirs:
    - ./output/browsergym_eval
    - ./results/wa_claude_judge
  seed: 42

model_configs:
  qwen3_coder:
    provider: mosaic-vllm
    name: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
    host_url: http://127.0.0.1:30000
    temperature: 0.7
    max_tokens: 8192
  qwen3_235b:
    provider: mosaic-vllm
    name: Qwen/Qwen3-235B-A22B-Instruct-2507
    host_url: http://127.0.0.1:30000
    temperature: 0.7
    max_tokens: 8192
  glm_4.5_fp8:
    provider: mosaic-vllm
    name: zai-org/GLM-4.5-FP8
    host_url: http://127.0.0.1:30000
    temperature: 0.7
    max_tokens: 8192
  claude:
    provider: anthropic 
    name: claude-sonnet-4-20250514
    temperature: 0.3
    max_tokens: 8192
  claude_3_7_sonnet:
    provider: anthropic 
    name: claude-3-7-sonnet-20250219
    temperature: 0.3
    max_tokens: 8192
  gpt_4.1:
    provider: openai 
    name: gpt-4.1
    temperature: 0.3
    max_tokens: 16384

benchmarks:
  webarena_reddit:
    dataset: webarena-shopping
    max_examples: 10
    max_steps: 15
    headless: true
    reset_env: false
    # viewport_size:
    #   width: 500
    #   height: 320

