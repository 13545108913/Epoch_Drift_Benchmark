# Skill Induction Test Configuration
# This config runs a small evaluation with online skill induction enabled

run_name: skill_induction_test

runner:
  threads: 1  # CRITICAL: Must be 1 for sequential skill learning
  batch_size: 1
  output_dirs:
    - ./output/browsergym/skill_induction_test
    - ./results/skill_induction_test  # Local directory for fast judge access
  seed: 42
  timeout_secs: 300  # 5 minutes per task

# Skill Induction Configuration
skill_induction:
  enabled: true
  judge_method: webjudge_online_mind2web
  judge_model:
    provider: openai
    name: gpt-4.1
    temperature: 0.0
    max_tokens: 4096
  storage_path: ./learned_skills/test_skills/
  min_actions: 2  # Minimum actions to form a skill
  max_actions: 15  # Maximum actions in a skill (increased for complex tasks)
  use_reward_signal: false  # If true, pre-filter by reward>0; if false, only trust LLM judge

model_configs:
  claude:
    provider: anthropic
    name: claude-sonnet-4-20250514
    temperature: 0.3
    max_tokens: 8192
  gpt_4o:
    provider: openai
    name: gpt-4.1
    temperature: 0.3
    max_tokens: 8192

benchmarks:
  webarena_shopping:
    dataset: webarena-shopping
    max_examples: 10
    max_steps: 15
    headless: true
    reset_env: false

agents:
  # gpt_4o_agent:
  #   name: hsm_v3  # Use HSM v3 for reliable performance
  #   model_config_name: gpt_4o
  claude_agent:
    name: hsm_v3
    model_config_name: claude

