run_name: test

runner:
  threads: 8
  output_dir: ./output/browsergym_eval
  seed: 42

model_configs:
  gpt_4o:
    provider: openai 
    name: gpt-4o
    temperature: 0.6
    max_tokens: 16384
  claude:
    provider: anthropic 
    name: claude-sonnet-4-20250514
    temperature: 0.6
    max_tokens: 8192

benchmarks:
  webarena_reddit:
    dataset: webarena-reddit
    max_examples: -1
    max_steps: 100
    headless: true
    reset_env: false
    # viewport_size:
    #   width: 500
    #   height: 320

agents:
  hsm_v3_claude:
    name: hsm_v3
    model_config_name: claude
