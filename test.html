<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Drift Injector 效果演示</title>
    <style>
        /* 原始样式 */
        body { font-family: sans-serif; padding: 40px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
        .btn-primary { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        h2 { color: #333; }
        .highlight { color: #d9534f; }
    </style>
</head>
<body>

    <div class="card" data-testid="login-card">
        <h2>用户登录</h2>
        <p>请输入您的<b>账号</b>和<b>密码</b>。</p>
        <p><span class="highlight">注意：</span> 请勿泄露密码。</p>
        
        <div style="margin-top: 20px;">
            <input type="text" data-testid="username-input" placeholder="用户名"><br><br>
            <button class="btn-primary" data-testid="submit-button">登录系统</button>
        </div>
    </div>

    <hr>
    <h3>控制台</h3>
    <button onclick="injectDrift()" style="padding: 10px; font-size: 16px;">💉 点击注入漂移 (High Intensity)</button>
    <p>点击上方按钮后，观察上面的登录卡片发生的<b>视觉</b>变化，并右键“检查元素”查看<b>DOM</b>变化。</p>

    <script>
        function injectDrift() {
            // === 模拟 Python 生成的种子随机数 (Seed: 42) ===
            window.__drift_seed = 42;
            const seededRandom = () => {
                window.__drift_seed = (window.__drift_seed * 9301 + 49297) % 233280;
                return window.__drift_seed / 233280;
            };
            const seededString = () => Math.floor(seededRandom() * 2147483648).toString(36);

            // === 1. 视觉漂移 (Visual Drift CSS) - 对应 intensity="high" ===
            const cssContent = `
                * { letter-spacing: 1.5px !important; word-spacing: 2px !important; }
                div, p, span { transform: rotate(0.2deg); } 
                body { filter: contrast(120%); }
                button, .btn { border: 3px dashed red !important; font-weight: bold !important; }
            `;
            const style = document.createElement('style');
            style.textContent = cssContent;
            document.head.appendChild(style);

            // === 2. 结构与定位漂移 (DOM Mutation) ===
            const applyDrift = (node) => {
                if (!node || node.nodeType !== 1) return;

                // [Locator Drift] 干扰 data-testid
                // 模拟 High 模式: remove_testid_prob=0.8
                if (node.getAttribute('data-testid') && !node.getAttribute('data-drifted-id')) {
                    const r = seededRandom();
                    if (r < 0.8) {
                        console.log(`[Locator Drift] Removing data-testid from <${node.tagName}>`);
                        node.removeAttribute('data-testid'); // 大概率直接移除
                    } else {
                        console.log(`[Locator Drift] Mutating data-testid on <${node.tagName}>`);
                        node.setAttribute('data-testid', node.getAttribute('data-testid') + '__drifted');
                    }
                    node.setAttribute('data-drifted-id', 'true');
                }

                // [Locator Drift] 干扰 Class
                if (!node.classList.contains('drift-c') && seededRandom() < 0.9) {
                    const cls = 'drift-' + seededString();
                    node.classList.add(cls, 'drift-c');
                }

                // [Structural Drift] 标签替换
                const tagMap = { 'B': 'STRONG', 'I': 'EM', 'SPAN': 'LABEL' };
                if (tagMap[node.tagName] && !node.getAttribute('data-drifted-tag')) {
                     // 仅当节点没有子元素且文本较短时替换，简化演示
                     if (node.children.length === 0) {
                        console.log(`[Structural Drift] Replacing <${node.tagName}> with <${tagMap[node.tagName]}>`);
                        const newTag = tagMap[node.tagName];
                        const newEl = document.createElement(newTag);
                        newEl.innerHTML = node.innerHTML;
                        newEl.className = node.className;
                        newEl.setAttribute('data-drifted-tag', 'true');
                        node.parentNode.replaceChild(newEl, node);
                     }
                }
            };

            document.querySelectorAll('*').forEach(applyDrift);
            alert("漂移已注入！请查看页面变化和控制台日志。");
        }
    </script>
</body>
</html>
